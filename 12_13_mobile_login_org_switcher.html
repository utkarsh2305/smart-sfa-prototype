<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart SFA - Mobile Login & Org Switcher</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            background: 'hsl(222 47% 11%)',
            card: 'hsl(222 47% 14%)',
            border: 'hsl(217 33% 22%)',
            input: 'hsl(217 33% 17%)',
            primary: 'hsl(199 89% 48%)',
            accent: 'hsl(142 71% 45%)',
            foreground: 'hsl(210 40% 98%)',
            muted: 'hsl(215 20% 65%)',
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
        },
      },
    }
  </script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Inter', sans-serif;
      background: hsl(222 47% 11%);
      color: hsl(210 40% 98%);
      display: flex;
      gap: 40px;
      padding: 40px;
      justify-content: center;
      align-items: flex-start;
    }
    .mobile-frame {
      width: 375px;
      background: hsl(222 47% 11%);
      border: 8px solid #333;
      border-radius: 32px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      position: relative;
    }
    .mobile-notch {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 24px;
      background: #333;
      border-radius: 0 0 16px 16px;
      z-index: 100;
    }
    .mobile-screen {
      height: 812px;
      overflow-y: auto;
      background: hsl(222 47% 11%);
    }
    .mobile-screen::-webkit-scrollbar {
      width: 0;
    }
    
    /* Login Screen Styles */
    .login-container {
      min-height: 812px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 32px 24px;
    }
    .logo-area {
      text-align: center;
      margin-bottom: 48px;
    }
    .logo-text {
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .tagline {
      font-size: 14px;
      color: hsl(215 20% 65%);
    }
    .login-form {
      max-width: 320px;
      margin: 0 auto;
      width: 100%;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      color: hsl(210 40% 98%);
      margin-bottom: 8px;
    }
    .input-wrapper {
      position: relative;
    }
    .input-field {
      background: hsl(217 33% 17%);
      border: 1px solid hsl(217 33% 22%);
      border-radius: 8px;
      padding: 12px 12px 12px 44px;
      height: 48px;
      width: 100%;
      color: hsl(210 40% 98%);
      font-size: 15px;
      transition: all 0.2s;
    }
    .input-field:focus {
      outline: none;
      border-color: hsl(199 89% 48%);
    }
    .input-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: hsl(215 20% 65%);
      width: 18px;
      height: 18px;
    }
    .eye-icon {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: hsl(215 20% 65%);
      width: 20px;
      height: 20px;
      cursor: pointer;
    }
    .forgot-link {
      display: block;
      text-align: right;
      font-size: 13px;
      color: hsl(199 89% 48%);
      text-decoration: none;
      margin-top: 8px;
      margin-bottom: 24px;
    }
    .btn {
      width: 100%;
      height: 48px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      border: none;
    }
    .btn-primary {
      background: hsl(199 89% 48%);
      color: white;
      margin-bottom: 20px;
    }
    .btn-secondary {
      background: hsl(217 33% 22%);
      color: hsl(210 40% 98%);
    }
    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 20px 0;
      color: hsl(215 20% 65%);
      font-size: 13px;
    }
    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: hsl(217 33% 22%);
    }
    .footer-text {
      text-align: center;
      font-size: 13px;
      color: hsl(215 20% 65%);
      margin-top: 32px;
    }
    
    /* Org Switcher Screen Styles */
    .top-bar {
      background: hsl(222 47% 14%);
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      border-bottom: 1px solid hsl(217 33% 22%);
      position: sticky;
      top: 0;
      z-index: 20;
    }
    .menu-icon {
      width: 24px;
      height: 24px;
      color: hsl(210 40% 98%);
      cursor: pointer;
    }
    .org-dropdown {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
    .notification-icon {
      width: 24px;
      height: 24px;
      color: hsl(210 40% 98%);
      cursor: pointer;
    }
    .org-switcher-overlay {
      background: hsl(222 47% 14%);
      border-bottom: 1px solid hsl(217 33% 22%);
    }
    .org-item {
      height: 56px;
      padding: 0 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 15px;
      border-bottom: 1px solid hsl(217 33% 22%);
      cursor: pointer;
      transition: background 0.2s;
    }
    .org-item:hover {
      background: hsl(217 33% 17%);
    }
    .org-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }
    .org-dot.active {
      background: hsl(199 89% 48%);
    }
    .content-area {
      flex: 1;
      padding: 20px;
    }
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 64px;
      background: hsl(222 47% 14%);
      border-top: 1px solid hsl(217 33% 22%);
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 0 8px;
    }
    .nav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      padding: 8px;
      transition: all 0.2s;
    }
    .nav-icon {
      width: 24px;
      height: 24px;
      color: hsl(215 20% 65%);
    }
    .nav-item.active .nav-icon {
      color: hsl(199 89% 48%);
    }
    .nav-label {
      font-size: 11px;
      color: hsl(215 20% 65%);
    }
    .nav-item.active .nav-label {
      color: hsl(199 89% 48%);
    }
    .screen-label {
      text-align: center;
      font-size: 12px;
      color: hsl(215 20% 65%);
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <!-- Mobile Frame 1: Login Screen -->
  <div class="mobile-frame">
    <div class="mobile-notch"></div>
    <div class="mobile-screen">
      <div class="screen-label" style="padding-top: 40px;">12_Mobile_Login</div>
      <div class="login-container">
        <!-- Logo Area -->
        <div class="logo-area">
          <div class="logo-text">Smart SFA</div>
          <div class="tagline">Field Sales Execution</div>
        </div>

        <!-- Login Form -->
        <form class="login-form" onsubmit="event.preventDefault(); alert('Logging in...');">
          <!-- Email -->
          <div class="form-group">
            <label class="form-label">Email</label>
            <div class="input-wrapper">
              <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                <polyline points="22,6 12,13 2,6"></polyline>
              </svg>
              <input 
                type="email" 
                class="input-field" 
                placeholder="your@email.com"
                required
              />
            </div>
          </div>

          <!-- Password -->
          <div class="form-group">
            <label class="form-label">Password</label>
            <div class="input-wrapper">
              <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
              </svg>
              <input 
                type="password" 
                class="input-field" 
                placeholder="••••••••"
                required
              />
              <svg class="eye-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </div>
          </div>

          <a href="#" class="forgot-link">Forgot password?</a>

          <!-- Login Button -->
          <button type="submit" class="btn btn-primary">
            Login
          </button>

          <!-- Divider -->
          <div class="divider">or</div>

          <!-- Fingerprint Button -->
          <button type="button" class="btn btn-secondary">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M2 12C2 6.5 6.5 2 12 2a10 10 0 0 1 8 4"></path>
              <path d="M5 19.5C5.5 18 6 15 6 12c0-.7.12-1.37.34-2"></path>
              <path d="M17.29 21.02c.12-.6.43-2.3.5-3.02"></path>
              <path d="M12 10a2 2 0 0 0-2 2c0 1.02-.1 2.51-.26 4"></path>
              <path d="M8.65 22c.21-.66.45-1.32.57-2 .1-.5.15-1 .15-1.5 0-1.08.01-2.17.09-3.25.06-.98.13-1.98.26-2.92"></path>
              <path d="M14.5 22c0-1.91.01-3.82.09-5.73.04-1.08.09-2.17.17-3.25.06-.98.12-1.97.24-2.94"></path>
              <path d="M18 22v-5.71c0-1.07.02-2.13.07-3.2.03-1.08.08-2.16.16-3.22"></path>
            </svg>
            Use fingerprint
          </button>

          <div class="footer-text">
            Don't have an account? <strong>Contact admin</strong>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Mobile Frame 2: Org Switcher -->
  <div class="mobile-frame">
    <div class="mobile-notch"></div>
    <div class="mobile-screen">
      <div class="screen-label" style="padding-top: 40px;">13_Mobile_Org_Switcher</div>
      
      <!-- Top Bar -->
      <div class="top-bar">
        <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
        
        <div class="org-dropdown">
          <span>BrandCo</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </div>
        
        <svg class="notification-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
        </svg>
      </div>

      <!-- Org Switcher Overlay -->
      <div class="org-switcher-overlay">
        <div class="org-item">
          <div class="org-dot active"></div>
          <span style="font-weight: 500;">BrandCo LATAM</span>
        </div>
        <div class="org-item">
          <div class="org-dot"></div>
          <span>DistributorXYZ</span>
        </div>
      </div>

      <!-- Content Area -->
      <div class="content-area" style="padding-bottom: 84px;">
        <div style="text-align: center; padding: 40px 20px; color: hsl(215 20% 65%);">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin: 0 auto 16px;">
            <rect x="3" y="3" width="7" height="7"></rect>
            <rect x="14" y="3" width="7" height="7"></rect>
            <rect x="14" y="14" width="7" height="7"></rect>
            <rect x="3" y="14" width="7" height="7"></rect>
          </svg>
          <p>Main app content appears here</p>
          <p style="font-size: 13px; margin-top: 8px;">Tap organization name above to switch</p>
        </div>
      </div>

      <!-- Bottom Navigation -->
      <div class="bottom-nav">
        <div class="nav-item active">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          </svg>
          <span class="nav-label">Home</span>
        </div>
        
        <div class="nav-item">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"></path>
            <rect x="9" y="3" width="6" height="4" rx="1"></rect>
          </svg>
          <span class="nav-label">Tasks</span>
        </div>
        
        <div class="nav-item">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="7" height="7"></rect>
            <rect x="14" y="3" width="7" height="7"></rect>
            <rect x="14" y="14" width="7" height="7"></rect>
            <rect x="3" y="14" width="7" height="7"></rect>
          </svg>
          <span class="nav-label">More</span>
        </div>
        
        <div class="nav-item">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
          <span class="nav-label">Profile</span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
